# Overlay either compose.yaml (source build) or compose.release.yaml (released image).
services:
  graft:
    environment:
      GRAFT_STORAGE: s3
      GRAFT_S3_ENDPOINT: ${GRAFT_S3_ENDPOINT:?Set the S3 HTTPS endpoint}
      GRAFT_S3_REGION: ${GRAFT_S3_REGION:?Set the matching region}
      GRAFT_S3_BUCKET: ${GRAFT_S3_BUCKET:?Set an existing bucket}
      GRAFT_S3_PREFIX: ${GRAFT_S3_PREFIX:-graft/}
      GRAFT_S3_FORCE_PATH_STYLE: ${GRAFT_S3_FORCE_PATH_STYLE:-true}
      GRAFT_S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      GRAFT_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
    secrets:
      - s3_access_key_id
      - s3_secret_access_key
secrets:
  s3_access_key_id:
    file: ./secrets/s3-access-key-id
  s3_secret_access_key:
    file: ./secrets/s3-secret-access-key
