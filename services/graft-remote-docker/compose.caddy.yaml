# Optional HTTPS proxy. Do not use when your existing proxy/platform owns 80/443.
services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      GRAFT_DOMAIN: ${GRAFT_DOMAIN:?Set your server hostname, without https://}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      graft:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
