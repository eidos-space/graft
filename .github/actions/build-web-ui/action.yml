name: Build Web UI
description: Generate the frontend assets embedded by the Graft CLI
inputs:
  repository:
    description: Checkout directory relative to the workspace
    default: .
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      with:
        version: 10.14.0
    - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: ${{ inputs.repository }}/web-ui/pnpm-lock.yaml
    - name: Install frontend dependencies
      shell: bash
      working-directory: ${{ inputs.repository }}
      run: pnpm --dir web-ui install --frozen-lockfile
    - name: Build embedded frontend
      shell: bash
      working-directory: ${{ inputs.repository }}
      run: pnpm --dir web-ui build
