name: CI

on:
  push:
    branches: ["main", "codex/e2ee-hardening-windows"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  skip-check:
    runs-on: ubuntu-24.04
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5
        with:
          paths_ignore: '["**.md", "docs/**"]'
  build:
    runs-on: ubuntu-24.04
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    steps:
      - name: system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          packages: build-essential
          version: 1.0

      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install Nextest
        uses: taiki-e/install-action@df7d4e2b3680b909f3a4aec8f15e498616ae9641 # nextest
        with:
          tool: nextest

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Installer script tests
        run: sh scripts/install-script.test.sh

      - name: Node.js for release policy tests
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: "24"

      - name: Release performance policy tests (no native benchmark)
        run: |
          node --test scripts/performance-report.test.mjs
          python3 scripts/e2ee-report-only.test.py

      - name: Build Web UI
        uses: ./.github/actions/build-web-ui

      - name: Web UI tests
        run: pnpm --dir web-ui test

      - name: Build Rust workspace
        run: just build-all

      - name: Smoke test embedded Web UI
        run: node web-ui/scripts/smoke-cli.mjs target/debug/graft

      - name: Test
        run: cargo nextest run

      - name: Cargo doctests
        run: cargo test --doc

      - name: Clippy
        # Lint first-party crates without re-linting the pinned vendored sources.
        # The vendored crates retain their upstream lint policy and are still
        # compiled as dependencies and exercised by the workspace test suite.
        run: cargo clippy --workspace --all-targets --exclude fjall --no-deps

  e2ee:
    name: Native E2EE and TypeScript interoperability
    runs-on: ubuntu-24.04
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"
          components: clippy

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: native-e2ee-msrv-1.91

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.14.0

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Native E2EE library tests
        run: cargo test -p graft --lib --features e2ee --locked

      - name: Independent E2EE format vectors
        run: |
          python3 -m venv /tmp/graft-e2ee-verifier
          /tmp/graft-e2ee-verifier/bin/pip install -r tests/e2ee/requirements-verifier.txt
          GRAFT_E2EE_VERIFY_PYTHON=/tmp/graft-e2ee-verifier/bin/python bash scripts/test-e2ee-vectors.sh
          GRAFT_E2EE_CARGO_FEATURES=e2ee,native-crypto GRAFT_E2EE_VERIFY_PYTHON=/tmp/graft-e2ee-verifier/bin/python bash scripts/test-e2ee-vectors.sh

      - name: Initialization persistence subprocess matrix
        run: |
          cargo test -p graft --lib --features e2ee --locked e2ee::initialization::tests:: -- --ignored --test-threads=1

      - name: Migration intent persistence subprocess matrix
        run: cargo test -p graft --lib --features e2ee --locked migration_creation_process_exit_recovers_only_exact_installed_intent -- --ignored --test-threads=1

      - name: Build Web UI
        uses: ./.github/actions/build-web-ui

      - name: Native E2EE CLI tests
        run: cargo test -p graft-cli --bin graft --features e2ee --locked

      - name: Native SDK migration source inventory
        run: cargo test -p graft-sdk --features e2ee --locked --test e2ee_migration

      - name: Native SDK sessions and encrypted storage placement
        run: |
          cargo test -p graft-sdk --features e2ee --locked --lib
          cargo test -p graft-sdk --features e2ee --locked --test e2ee_storage_placement

      - name: Native E2EE clippy
        run: cargo clippy -p graft -p graft-sdk -p graft-sdk-node -p graft-cli --features graft-sdk-node/e2ee,graft-cli/e2ee --all-targets --no-deps --locked -- -D warnings

      - name: Native client and actual TypeScript protocol handler
        run: pnpm test:e2ee-interop

      - name: Encrypted pack budgets and aggregate adversarial regressions
        run: cargo test -p graft --features e2ee --test e2ee_pack_sync --locked -- --ignored --test-threads=1

      - name: Encrypted migration coordinator and fenced cutover
        run: cargo test -p graft-sdk --features e2ee --test e2ee_coordinator --locked -- --ignored --test-threads=1

      - name: Native Node E2EE host and SDK regressions
        run: pnpm test:e2ee-node

      - name: Retain synthetic privacy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2ee-privacy-native-interop-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/e2ee-privacy-evidence
          if-no-files-found: warn
          retention-days: 14

  msrv:
    name: Check MSRV 1.91
    runs-on: ubuntu-24.04
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    steps:
      - name: system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          packages: build-essential
          version: 1.0

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: msrv-1.91

      - name: Build Web UI
        uses: ./.github/actions/build-web-ui

      - name: Cargo check
        run: cargo check --workspace --all-targets --locked
