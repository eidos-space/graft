name: Graft Performance

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.*"
      - "crates/**"
      - "vendor/**"
      - "web-ui/**"
      - "scripts/performance-report*"
      - ".github/workflows/benchmark.yml"
      - ".github/workflows/performance-report.yml"
  workflow_dispatch:

concurrency:
  group: graft-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: Record one CLI observation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      PERF_RUNNER: ubuntu-24.04
      PERF_ARCH: x64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare evidence paths
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/graft-performance-target" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/graft-performance-cli" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/graft-performance-cli"
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: "24"
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
        with:
          packages: clang libclang-dev llvm libncurses-dev build-essential libreadline-dev
          version: 1.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: performance-cli
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.14.0
      - name: Build embedded Web UI when present
        if: hashFiles('web-ui/package.json') != ''
        run: |
          pnpm --dir web-ui install --frozen-lockfile
          pnpm --dir web-ui build
      - name: Build the candidate once
        run: cargo build --release --locked -p graft-cli -p graft-bench
      - name: Measure once without rebuilding the previous release
        run: |
          "$CARGO_TARGET_DIR/release/graft-bench" run \
            --graft-bin "$CARGO_TARGET_DIR/release/graft" \
            --output "$EVIDENCE_DIR/raw.json" --label "$(git rev-parse HEAD)" \
            --profile ci --samples 1 --warmups 0
          node scripts/performance-report.mjs normalize cli "$EVIDENCE_DIR/raw.json" "$EVIDENCE_DIR/measurement.json"
      - name: Keep the observation, including failed-run logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graft-performance-cli
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
