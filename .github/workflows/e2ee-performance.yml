name: E2EE Performance

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.*"
      - "crates/**"
      - "vendor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/graft-remote/**"
      - "tests/e2ee/**"
      - "scripts/e2ee-load-benchmark.py"
      - "scripts/e2ee-performance-*"
      - "scripts/performance-report*"
      - ".github/workflows/e2ee-performance.yml"
      - ".github/workflows/performance-report.yml"
  workflow_dispatch:

concurrency:
  group: e2ee-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: Record core, SDK and hydration once each
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      PYTHONDONTWRITEBYTECODE: 1
      PERF_RUNNER: ubuntu-24.04
      PERF_ARCH: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare isolated evidence and fixtures
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/graft-e2ee-performance-target" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/graft-e2ee-performance" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/graft-e2ee-fixtures" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/graft-e2ee-performance"
          install -d -m 700 "$RUNNER_TEMP/graft-e2ee-fixtures"
          git rev-parse HEAD > "$RUNNER_TEMP/graft-e2ee-performance/source.txt"
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
        with:
          packages: clang libclang-dev llvm libncurses-dev build-essential libreadline-dev
          version: 1.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: performance-e2ee
      - name: Build the candidate examples and actual Remote
        id: build
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE_DIR/install.log"
          pnpm --filter @eidos.space/graft-remote build 2>&1 | tee "$EVIDENCE_DIR/remote-build.log"
          cargo build --release --locked -p graft --features native-crypto \
            --example e2ee_load_benchmark 2>&1 | tee "$EVIDENCE_DIR/core-build.log"
          cargo build --release --locked -p graft-sdk --features native-crypto,bundled-sqlite \
            --example e2ee_sync_benchmark --example e2ee_sqlite_hydration_benchmark \
            2>&1 | tee "$EVIDENCE_DIR/sdk-build.log"
      - name: Core observation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/e2ee-load-benchmark.py --rounds 1 --order plain-first --report-only \
            --binary "$CARGO_TARGET_DIR/release/examples/e2ee_load_benchmark" \
            --output "$EVIDENCE_DIR/core" 2>&1 | tee "$EVIDENCE_DIR/core.log"
          node scripts/performance-report.mjs normalize e2ee-core "$EVIDENCE_DIR/core/summary.json" "$EVIDENCE_DIR/core/measurement.json"
      - name: SDK observation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/e2ee-load-benchmark.py --paired --rounds 1 --order plain-first --report-only \
            --binary "$CARGO_TARGET_DIR/release/examples/e2ee_sync_benchmark" \
            --output "$EVIDENCE_DIR/sdk" 2>&1 | tee "$EVIDENCE_DIR/sdk.log"
          node scripts/performance-report.mjs normalize e2ee-sdk "$EVIDENCE_DIR/sdk/summary.json" "$EVIDENCE_DIR/sdk/measurement.json"
      - name: SQLite hydration observation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/e2ee-load-benchmark.py --paired --rounds 1 --order plain-first --report-only \
            --binary "$CARGO_TARGET_DIR/release/examples/e2ee_sqlite_hydration_benchmark" \
            --output "$EVIDENCE_DIR/hydration" 2>&1 | tee "$EVIDENCE_DIR/hydration.log"
          node scripts/performance-report.mjs normalize e2ee-hydration "$EVIDENCE_DIR/hydration/summary.json" "$EVIDENCE_DIR/hydration/measurement.json"
      - name: Retain raw samples, resources and reference budget outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graft-performance-e2ee
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
