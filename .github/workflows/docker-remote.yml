name: Check Docker Graft server
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/graft-remote-docker/**'
      - 'packages/graft-remote/**'
      - '.github/workflows/docker-remote.yml'
      - '.github/workflows/docker-release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'services/graft-remote-docker/**'
      - 'packages/graft-remote/**'
      - '.github/workflows/docker-remote.yml'
      - '.github/workflows/docker-release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      public_sdk:
        description: Verify the pinned public SDK on native Linux before Docker publication
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: docker-remote-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            native: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            native: linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix services/graft-remote-docker --ignore-scripts
      - run: pnpm test:docker
      - if: ${{ !inputs.public_sdk }}
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - if: ${{ !inputs.public_sdk }}
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - if: ${{ !inputs.public_sdk }}
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev build-essential
      - name: Build E2EE SDK
        if: ${{ !inputs.public_sdk }}
        run: bash packages/graft-sdk/scripts/build-native.sh ${{ matrix.target }} packages/graft-sdk/native e2ee
      - name: Compose and native encrypted round trip (isolated data)
        if: ${{ !inputs.public_sdk }}
        run: pnpm test:docker:container
      - name: Public SDK proof and recovery on the matching Linux architecture
        if: ${{ inputs.public_sdk }}
        env:
          NATIVE: ${{ matrix.native }}
        run: |
          set -euo pipefail
          sdk=$(cat services/graft-remote-docker/SDK_VERSION)
          remote=$(cat services/graft-remote-docker/REMOTE_VERSION)
          test "$(node -p "require('./packages/graft-remote/package.json').version")" = "$remote"
          test "$(npm view "@eidos.space/graft-remote@$remote" version)" = "$remote"
          npm install --prefix /tmp/graft-public-sdk --ignore-scripts "@eidos.space/graft@$sdk"
          export GRAFT_PUBLIC_SDK_ROOT=/tmp/graft-public-sdk/node_modules/@eidos.space/graft
          export GRAFT_PUBLIC_NATIVE_NAME="$NATIVE"
          export GRAFT_TEST_IMAGE=graft-public-proof:local
          export GRAFT_S3_TEST_IMAGE=graft-s3-fixture:local
          docker build -t "$GRAFT_S3_TEST_IMAGE" -f services/graft-remote-docker/test/Minio.Dockerfile .
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$GRAFT_TEST_IMAGE" -f services/graft-remote-docker/Dockerfile .
          bash services/graft-remote-docker/test/public-sdk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && inputs.public_sdk }}
        with:
          name: public-sdk-proof-${{ matrix.native }}
          path: public-sdk-*.log
