name: Release Graft CLI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::release version must match X.Y.Z or X.Y.Z-rc.N"
            exit 1
          fi
          prerelease="false"
          if [[ "$version" == *-* ]]; then
            prerelease="true"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Validate release commit and crate versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "::error::release commit is not reachable from origin/main"
            exit 1
          fi
          if ! git ls-remote --exit-code origin "refs/tags/${GITHUB_REF_NAME}^{}" >/dev/null; then
            echo "::error::release tag ${GITHUB_REF_NAME} must be annotated"
            exit 1
          fi
          crates=(graft graft-sqlite graft-cli graft-test graft-tracing)
          for crate in "${crates[@]}"; do
            crate_version="$(cargo pkgid -p "$crate" | sed 's/.*#//')"
            if [[ "$crate_version" != "$RELEASE_VERSION" ]]; then
              echo "::error::$crate is $crate_version, expected $RELEASE_VERSION"
              exit 1
            fi
          done
          cargo metadata --locked --format-version 1 --no-deps >/dev/null

  build:
    name: Build ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-2022
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --package graft-cli --target "${{ matrix.target }}"

      - name: Smoke test CLI
        if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'aarch64-pc-windows-msvc'
        run: |
          binary="target/${{ matrix.target }}/release/graft"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            binary="${binary}.exe"
          fi
          "$binary" --help >/dev/null

      - name: Stage CLI artifact
        run: |
          artifact_dir="package/${{ matrix.target }}"
          mkdir -p "$artifact_dir"
          binary="graft"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            binary="graft.exe"
          fi
          cp "target/${{ matrix.target }}/release/${binary}" "$artifact_dir/"
          cp LICENSE-APACHE LICENSE-MIT "$artifact_dir/"
          cat > "$artifact_dir/README.txt" <<EOF
          Graft CLI
          Version: ${{ needs.metadata.outputs.version }}
          Target: ${{ matrix.target }}
          Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graft-cli-${{ matrix.target }}
          path: package/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Prepare changelog release notes
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          awk -v heading="## Graft ${RELEASE_VERSION} —" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: graft-cli-*
          path: downloaded/

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p release-assets
          asset_dir="$PWD/release-assets"
          version="${{ needs.metadata.outputs.version }}"
          cli_dirs=(downloaded/graft-cli-*)
          if ((${#cli_dirs[@]} == 0)); then
            echo "::error::no CLI artifacts were downloaded"
            exit 1
          fi
          for dir in "${cli_dirs[@]}"; do
            target="${dir#downloaded/graft-cli-}"
            archive_base="graft-cli-${version}-${target}"
            if [[ "$target" == *"windows"* ]]; then
              (cd "$dir" && zip -r "${asset_dir}/${archive_base}.zip" .)
            else
              chmod 755 "$dir/graft"
              tar -czf "${asset_dir}/${archive_base}.tar.gz" -C "$dir" .
            fi
          done
          for archive in release-assets/*.tar.gz; do
            extract_dir="$(mktemp -d)"
            tar -xzf "$archive" -C "$extract_dir"
            test -x "$extract_dir/graft"
            rm -rf "$extract_dir"
          done
          (cd release-assets && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          name: ${{ needs.metadata.outputs.release_tag }}
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          make_latest: ${{ needs.metadata.outputs.prerelease == 'false' }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: release-assets/*
