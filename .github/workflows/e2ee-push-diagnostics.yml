name: E2EE Push Wait Diagnostics

on:
  workflow_dispatch:
  push:
    branches: ["codex/e2ee-push-diagnostics"]
    paths:
      - "scripts/e2ee-push-wait-diagnostics.py"
      - ".github/workflows/e2ee-push-diagnostics.yml"

permissions:
  contents: read

jobs:
  history:
    name: Fixed sampled history4097 diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      PYTHONDONTWRITEBYTECODE: 1
      RUST_BACKTRACE: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set private build and fixture paths
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/graft-push-diagnostic-target" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/graft-push-wait-evidence" >> "$GITHUB_ENV"
          install -d -m 700 "$RUNNER_TEMP/graft-push-wait-fixtures"
          echo "TMPDIR=$RUNNER_TEMP/graft-push-wait-fixtures" >> "$GITHUB_ENV"
      - name: System dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
        with:
          packages: clang libclang-dev llvm libncurses-dev build-essential libreadline-dev strace
          version: 1.0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"
      - name: pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: "24"
      - name: Capture exact source and tool provenance
        run: python3 scripts/e2ee-push-wait-diagnostics.py source --output "$EVIDENCE_DIR"
      - name: Build only core release example and loopback Remote
        run: |
          pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE_DIR/install.log"
          pnpm --filter @eidos.space/graft-remote build 2>&1 | tee "$EVIDENCE_DIR/remote-build.log"
          cargo build --release --locked -p graft --features native-crypto --example e2ee_load_benchmark \
            2>&1 | tee "$EVIDENCE_DIR/core-build.log"
      - name: Run three sampled pairs and one seccomp-filtered pair
        run: |
          python3 scripts/e2ee-push-wait-diagnostics.py run --output "$EVIDENCE_DIR" \
            --binary "$CARGO_TARGET_DIR/release/examples/e2ee_load_benchmark"
      - name: Hash all evidence including failures
        if: ${{ always() }}
        run: python3 scripts/e2ee-push-wait-diagnostics.py finalize --output "$EVIDENCE_DIR"
      - name: Retain diagnostic artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2ee-push-wait-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/graft-push-wait-evidence
          if-no-files-found: error
          retention-days: 30
