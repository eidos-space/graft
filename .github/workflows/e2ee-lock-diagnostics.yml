name: E2EE Linux Lock Diagnostics

on:
  workflow_dispatch:
  push:
    branches: ["codex/e2ee-lock-diagnostics"]
    paths:
      - "scripts/e2ee-lock-diagnostics.py"
      - ".github/workflows/e2ee-lock-diagnostics.yml"

permissions:
  contents: read

jobs:
  tmpfiles:
    name: Isolated synthetic tmpfiles directory locks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Reproduce directory lock ownership and parent protection
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          python3 scripts/e2ee-lock-diagnostics.py --output "$RUNNER_TEMP/graft-lock-diagnostics"
      - name: Retain evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2ee-lock-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/graft-lock-diagnostics
          if-no-files-found: error
          retention-days: 30
