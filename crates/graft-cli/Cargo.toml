[package]
name = "graft-cli"
version = "0.15.5"
edition = "2024"
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
rust-version = { workspace = true }
autobins = false

[[bin]]
name = "graft"
path = "src/main.rs"

[dependencies]
graft = { path = "../graft" }
graft-sdk = { path = "../graft-sdk" }
graft-sqlite = { path = "../graft-sqlite" }

anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rusqlite = { workspace = true, features = ["bundled"] }
serde_json = "1.0"
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }
zeroize = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.180", optional = true }
rustix = { version = "=1.1.3", features = ["termios", "process"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[features]
default = []
e2ee = ["graft/native-crypto", "graft-sdk/native-crypto", "graft-sqlite/e2ee", "dep:tokio", "dep:zeroize", "dep:libc", "dep:rustix"]

[lints]
workspace = true
