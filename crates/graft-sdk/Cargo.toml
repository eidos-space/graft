[package]
name = "graft-sdk"
version = "0.3.30"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

description = "Long-lived embedded repository sessions for Graft."

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
graft = { path = "../graft", version = "0.15.5" }
graft-sqlite = { path = "../graft-sqlite", version = "0.15.5" }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
zeroize = { workspace = true, optional = true }

[features]
default = []
e2ee = ["graft/e2ee", "graft-sqlite/e2ee", "dep:tokio", "dep:zeroize"]
native-crypto = ["e2ee", "graft/native-crypto"]
macos-keychain = ["e2ee", "graft/macos-keychain"]
bundled-sqlite = ["graft-sqlite/bundled-sqlite"]

[dev-dependencies]
rusqlite = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
zeroize = { workspace = true }

[[example]]
name = "e2ee_sync_benchmark"
required-features = ["e2ee"]

[[example]]
name = "e2ee_sqlite_hydration_benchmark"
required-features = ["e2ee"]
