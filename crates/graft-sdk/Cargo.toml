[package]
name = "graft-sdk"
version = "0.3.15"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

description = "Long-lived embedded repository sessions for Graft."

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
graft = { path = "../graft", version = "0.13.0" }
graft-sqlite = { path = "../graft-sqlite", version = "0.13.0" }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }

[features]
default = []
bundled-sqlite = ["graft-sqlite/bundled-sqlite"]

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = { workspace = true }
