[package]
name = "graft-sdk-node"
version = "0.3.1"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

description = "ABI-stable Node-API bindings for long-lived Graft repository sessions."

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
graft-sdk = { path = "../graft-sdk", version = "0.3.1", features = ["bundled-sqlite"] }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = "1.0"

[build-dependencies]
napi-build = { workspace = true }
