[package]
name = "graft-native-crypto"
version = "0.16.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Target-aware feature routing for Graft native cryptography backends."

[lints]
workspace = true

[features]
default = []
backend = ["dep:sha2"]

[target.'cfg(all(not(target_os = "windows"), any(target_arch = "aarch64", target_arch = "x86", target_arch = "x86_64")))'.dependencies]
sha2 = { workspace = true, optional = true, features = ["asm"] }
