[package]
name = "graft"
version = "0.16.1"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

description = "The Graft storage engine."

[lints]
workspace = true

[dependencies]
argon2 = { workspace = true, optional = true, default-features = false, features = ["zeroize"] }
assert_matches = { workspace = true }
base64 = { workspace = true }
bilrost = { workspace = true, features = ["bytestring", "thin-vec"] }
blake3 = { workspace = true }
bs58 = { workspace = true }
bytes = { workspace = true }
bytestring = { workspace = true }
circular-buffer = { workspace = true }
chacha20poly1305 = { workspace = true, optional = true, default-features = false, features = ["alloc"] }
fjall = { workspace = true }
foldhash = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true, optional = true }
graft-native-crypto = { path = "../graft-native-crypto", version = "0.16.1", optional = true, features = ["backend"] }
hashbrown = { workspace = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
ignore = { workspace = true }
itertools = { workspace = true }
lz4_flex = { workspace = true }
parking_lot = { workspace = true }
precept = { workspace = true, optional = true }
rand = { workspace = true }
range-set-blaze = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
sha2 = { workspace = true, optional = true }
static_assertions = { workspace = true }
tempfile = { workspace = true }
text_trees = { workspace = true }
thin-vec = { workspace = true }
thiserror = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tryiter = { workspace = true }
xxhash-rust = { workspace = true }
zerocopy = { workspace = true }
zeroize = { workspace = true }
zstd = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
opendal = { workspace = true, features = [
    "reqwest-rustls-tls",
    "executors-tokio",
    "layers-concurrent-limit",
    "layers-logging",
    "layers-retry",
    "layers-timeout",
    "services-s3",
    "services-fs",
] }
reqwest = { workspace = true }
splinter-rs = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "parking_lot"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
assert_matches = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
test-log = { workspace = true, features = ["trace"] }

[features]
default = []
testutil = []
precept = ["dep:precept"]
e2ee = ["dep:argon2", "dep:chacha20poly1305", "dep:getrandom", "dep:hkdf", "dep:hmac", "dep:sha2", "tokio/fs", "tokio/io-util"]
# Native hosts opt in to RustCrypto's runtime-detected hardware backend.
native-crypto = ["e2ee", "dep:graft-native-crypto"]
macos-keychain = ["e2ee", "dep:security-framework"]

[[example]]
name = "e2ee_range_benchmark"
required-features = ["e2ee"]

[[example]]
name = "e2ee_load_benchmark"
required-features = ["e2ee"]
